name: GTK WASM Build and Test
# Copyright 2025 Superstruct Ltd, New Zealand
# Licensed under LGPL-2.1-or-later

on:
  push:
    branches: [ wasm, main ]
  pull_request:
    branches: [ wasm, main ]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'

env:
  EM_VERSION: 3.1.47
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  setup-cache:
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Generate cache key
        id: cache-key
        run: echo "key=emsdk-${{ env.EM_VERSION }}-${{ runner.os }}" >> $GITHUB_OUTPUT

  build-dependencies:
    runs-on: ubuntu-22.04
    needs: setup-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'tests/wasm/package.json'

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v3
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: ${{ needs.setup-cache.outputs.cache-key }}

      - name: Setup Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EM_CACHE_FOLDER }}
          cd ${{ env.EM_CACHE_FOLDER }}
          ./emsdk install ${{ env.EM_VERSION }}
          ./emsdk activate ${{ env.EM_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            gettext \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libxdamage-dev \
            libxcomposite-dev

      - name: Install test dependencies
        working-directory: tests/wasm
        run: npm ci

  validate-environment:
    runs-on: ubuntu-22.04
    needs: [setup-cache, build-dependencies]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Emscripten cache
        uses: actions/cache@v3
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: ${{ needs.setup-cache.outputs.cache-key }}

      - name: Setup Emscripten environment
        run: |
          cd ${{ env.EM_CACHE_FOLDER }}
          source ./emsdk_env.sh
          echo "EMSDK_ROOT=$(pwd)" >> $GITHUB_ENV
          echo "$(pwd):$(pwd)/upstream/emscripten" >> $GITHUB_PATH

      - name: Validate build configuration
        run: |
          source ${{ env.EM_CACHE_FOLDER }}/emsdk_env.sh
          emcc --version
          which emcc
          pkg-config --version
          meson --version

      - name: Validate cross-compilation config
        run: |
          if [[ -f wasm-cross.txt ]]; then
            echo "✅ Cross-compilation config found"
            cat wasm-cross.txt
          else
            echo "❌ Cross-compilation config missing"
            exit 1
          fi

      - name: Check build script
        run: |
          if [[ -x build-wasm.sh ]]; then
            echo "✅ Build script executable"
          else
            echo "❌ Build script not executable or missing"
            chmod +x build-wasm.sh || exit 1
          fi

  build-wasm:
    runs-on: ubuntu-22.04
    needs: [setup-cache, validate-environment]
    strategy:
      matrix:
        build-type: [debug, release]
        features: [minimal, full]
        include:
          - build-type: debug
            optimization: -O1
          - build-type: release
            optimization: -O3
          - features: minimal
            extra-flags: --disable-demos --disable-examples
          - features: full
            extra-flags: --enable-introspection --enable-broadway-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Emscripten cache
        uses: actions/cache@v3
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: ${{ needs.setup-cache.outputs.cache-key }}

      - name: Setup Emscripten environment
        run: |
          cd ${{ env.EM_CACHE_FOLDER }}
          source ./emsdk_env.sh
          echo "EMSDK_ROOT=$(pwd)" >> $GITHUB_ENV
          echo "$(pwd):$(pwd)/upstream/emscripten" >> $GITHUB_PATH

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            builddir
            _build
          key: gtk-wasm-build-${{ matrix.build-type }}-${{ matrix.features }}-${{ github.sha }}
          restore-keys: |
            gtk-wasm-build-${{ matrix.build-type }}-${{ matrix.features }}-
            gtk-wasm-build-${{ matrix.build-type }}-
            gtk-wasm-build-

      - name: Build GTK WASM (${{ matrix.build-type }}-${{ matrix.features }})
        run: |
          source ${{ env.EM_CACHE_FOLDER }}/emsdk_env.sh
          export CFLAGS="${{ matrix.optimization }} -g"
          export CXXFLAGS="${{ matrix.optimization }} -g"
          ./build-wasm.sh \
            --build-type=${{ matrix.build-type }} \
            --features=${{ matrix.features }} \
            ${{ matrix.extra-flags }}
        timeout-minutes: 45

      - name: Validate build output
        run: |
          if [[ -f dist/gtk4.wasm && -f dist/gtk4.js ]]; then
            echo "✅ Build successful"
            ls -la dist/
            echo "WASM size: $(du -h dist/gtk4.wasm | cut -f1)"
            echo "JS size: $(du -h dist/gtk4.js | cut -f1)"
          else
            echo "❌ Build failed - missing output files"
            ls -la dist/ || true
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: gtk-wasm-${{ matrix.build-type }}-${{ matrix.features }}
          path: |
            dist/
            !dist/**/*.tmp
          retention-days: 7

      - name: Generate build summary
        run: |
          echo "## Build Summary (${{ matrix.build-type }}-${{ matrix.features }})" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for file in dist/*; do
            if [[ -f "$file" ]]; then
              echo "| $(basename $file) | $(du -h $file | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Build Type: ${{ matrix.build-type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Features: ${{ matrix.features }}" >> $GITHUB_STEP_SUMMARY
          echo "- Optimization: ${{ matrix.optimization }}" >> $GITHUB_STEP_SUMMARY

  test-node:
    runs-on: ubuntu-22.04
    needs: [build-wasm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download build artifacts (release-full)
        uses: actions/download-artifact@v3
        with:
          name: gtk-wasm-release-full
          path: ./

      - name: Install test dependencies
        working-directory: tests/wasm
        run: npm ci

      - name: Run Node.js tests
        working-directory: tests/wasm
        run: |
          npm run test 2>&1 | tee test-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: node-test-results
          path: tests/wasm/test-output.log

      - name: Generate test summary
        if: always()
        run: |
          echo "## Node.js Test Results" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ env.exit_code }}" == "0" ]]; then
            echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          tail -20 tests/wasm/test-output.log >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

  test-browser:
    runs-on: ubuntu-22.04
    needs: [build-wasm]
    strategy:
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download build artifacts (release-full)
        uses: actions/download-artifact@v3
        with:
          name: gtk-wasm-release-full
          path: ./

      - name: Install test dependencies
        working-directory: tests/wasm
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/wasm
        run: npx playwright install ${{ matrix.browser }}

      - name: Start HTTP server
        working-directory: tests/wasm
        run: |
          npm run serve &
          sleep 5
          curl -f http://localhost:8080 || exit 1

      - name: Run browser tests (${{ matrix.browser }})
        working-directory: tests/wasm
        run: |
          BROWSER=${{ matrix.browser }} npm run test:browser 2>&1 | tee browser-test-${{ matrix.browser }}.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload browser test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: |
            tests/wasm/browser-test-*.log
            tests/wasm/browser-test-report.json

      - name: Generate browser test summary
        if: always()
        run: |
          echo "## Browser Test Results (${{ matrix.browser }})" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ env.exit_code }}" == "0" ]]; then
            echo "✅ **All browser tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some browser tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          tail -20 tests/wasm/browser-test-${{ matrix.browser }}.log >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

  benchmark:
    runs-on: ubuntu-22.04
    needs: [build-wasm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download build artifacts (release-full)
        uses: actions/download-artifact@v3
        with:
          name: gtk-wasm-release-full
          path: ./

      - name: Install test dependencies
        working-directory: tests/wasm
        run: npm ci

      - name: Run performance benchmarks
        working-directory: tests/wasm
        run: |
          npm run benchmark 2>&1 | tee benchmark-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: benchmark-results
          path: |
            tests/wasm/benchmark-output.log
            tests/wasm/benchmark-report.json

      - name: Generate benchmark summary
        if: always()
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ env.exit_code }}" == "0" ]]; then
            echo "✅ **Benchmarks completed successfully**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Benchmark execution failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract key metrics from benchmark log
          if [[ -f tests/wasm/benchmark-output.log ]]; then
            echo "### Key Performance Metrics" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            grep -A 10 "Key Performance Insights" tests/wasm/benchmark-output.log || echo "No insights found" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi

  security-scan:
    runs-on: ubuntu-22.04
    needs: [build-wasm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts (release-full)
        uses: actions/download-artifact@v3
        with:
          name: gtk-wasm-release-full
          path: ./

      - name: Security scan of build artifacts
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "### WASM Binary Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Check for potential security issues in WASM binary
          if command -v wasm-objdump &> /dev/null; then
            wasm-objdump -x dist/gtk4.wasm | head -50 >> wasm-analysis.txt
            echo "```" >> $GITHUB_STEP_SUMMARY
            cat wasm-analysis.txt >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          else
            echo "wasm-objdump not available - skipping detailed analysis" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Basic file validation
          echo "### File Integrity" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Type |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          for file in dist/*; do
            if [[ -f "$file" ]]; then
              echo "| $(basename $file) | $(du -h $file | cut -f1) | $(file -b $file | cut -d',' -f1) |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  integration-test:
    runs-on: ubuntu-22.04
    needs: [test-node, test-browser, benchmark]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Generate integration report
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Test Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Check Node.js tests
          if [[ -f artifacts/node-test-results/test-output.log ]]; then
            if grep -q "All tests passed" artifacts/node-test-results/test-output.log; then
              echo "| Node.js Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Node.js Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Node.js Tests | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check browser tests
          for browser in chromium firefox; do
            if [[ -d "artifacts/browser-test-results-$browser" ]]; then
              if ls artifacts/browser-test-results-$browser/*.log 2>/dev/null | xargs grep -l "tests passed" > /dev/null; then
                echo "| Browser Tests ($browser) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| Browser Tests ($browser) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| Browser Tests ($browser) | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          # Check benchmarks
          if [[ -f artifacts/benchmark-results/benchmark-output.log ]]; then
            if grep -q "Benchmark suite completed" artifacts/benchmark-results/benchmark-output.log; then
              echo "| Performance Benchmarks | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Performance Benchmarks | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Performance Benchmarks | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Available build configurations:" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/gtk-wasm-* 2>/dev/null || echo "No build artifacts found" >> $GITHUB_STEP_SUMMARY

  notify-completion:
    runs-on: ubuntu-22.04
    needs: [integration-test]
    if: always()
    steps:
      - name: Workflow completion notification
        run: |
          echo "## 🎉 GTK WASM CI/CD Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review test results and benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "- Download build artifacts if needed" >> $GITHUB_STEP_SUMMARY
          echo "- Check integration report for any issues" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor performance trends over time" >> $GITHUB_STEP_SUMMARY