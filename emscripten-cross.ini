[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
nm = 'emnm'
strip = 'emstrip'
cmake = 'emcmake'
pkg-config = 'em-pkg-config'

[built-in options]
c_args = ['-Iinstall/include', '-Iinstall/include/freetype2', '-Iinstall/include/pixman-1', '-O3', '-msimd128', '-fPIC', '-pthread']
cpp_args = ['-Iinstall/include', '-Iinstall/include/freetype2', '-Iinstall/include/pixman-1', '-O3', '-msimd128', '-fPIC', '-pthread']
c_link_args = ['-Linstall/lib', '-sSIDE_MODULE=2', '-sWASM_BIGINT=1', '-sEXPORT_ALL=1', '-pthread', '-sPTHREAD_POOL_SIZE=4']
cpp_link_args = ['-Linstall/lib', '-sSIDE_MODULE=2', '-sWASM_BIGINT=1', '-sEXPORT_ALL=1', '-pthread', '-sPTHREAD_POOL_SIZE=4']

[properties]
sys_root = '.'
pkg_config_libdir = 'install/lib/pkgconfig'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'