<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Font directory -->
  <dir>/fonts</dir>

  <!-- Accept TrueType fonts -->
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="scalable"><bool>true</bool></patelt>
      </pattern>
    </acceptfont>
  </selectfont>

  <!-- Alias common font families to Roboto -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>

  <!-- Cache settings -->
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- Rendering settings -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>
</fontconfig>
